name: New skill or lane
description: Something SEO or AI-visibility work needs that this pack does not do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The pack is deliberately narrow: each skill does one job and hands off by
        name. A request that spans several jobs is usually a chain of existing
        skills, so check `docs/workflows.md` first.

  - type: textarea
    id: job
    attributes:
      label: The job to be done
      description: One sentence. What decision would this skill let someone make?
      placeholder: Decide which of two competing pages should be redirected into the other.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you do it today, and what is slow or wrong about that
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: What data it would need
      description: >
        And what it should do when that data is missing. Nothing here estimates a
        number it cannot source, so a skill that only works with a paid connector
        needs an honest degraded mode.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is one job, not a workflow of several
        - label: It would be useful in any market, not only mine
        - label: I have checked the 26 existing skills in the README catalogue
